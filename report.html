<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食养周报 · 七白润光</title>
  <style>
    :root{--color-primary:#E8B4C5;--color-primary-dark:#C985A0;--color-gold:#C9A84C;--color-gold-dark:#A07830;--color-gold-light:#F0D080;--color-ivory:#FDFAF5;--color-cream:#FEF6EC;--color-warm-brown:#6B4226;--color-warm-brown-light:#A0704A;--color-dark-bg:#1A1208;--font-serif:'Noto Serif SC','SimSun',Georgia,serif;--font-sans:'PingFang SC','Microsoft YaHei',sans-serif;--radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-full:9999px;--shadow-sm:0 2px 8px rgba(200,130,100,0.1);--shadow-md:0 8px 32px rgba(200,130,100,0.15);--transition:0.3s cubic-bezier(0.25,0.46,0.45,0.94);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font-sans);background:var(--color-ivory);color:var(--color-warm-brown);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    .navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(253,250,245,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,0.12);}
    .brand{display:flex;align-items:center;gap:0.5rem;}
    .brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary),var(--color-gold));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
    .brand-name{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--color-warm-brown),var(--color-gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .nav-links{display:flex;gap:1rem;align-items:center;font-size:0.85rem;}
    .nav-links a{color:var(--color-warm-brown-light);transition:color var(--transition);}
    .nav-links a:hover{color:var(--color-warm-brown);}
    .page-wrap{max-width:900px;margin:0 auto;padding:88px 2rem 4rem;}

    /* Period switch */
    .period-switch{display:flex;background:white;border-radius:var(--radius-full);padding:4px;box-shadow:var(--shadow-sm);width:fit-content;margin-bottom:1.5rem;}
    .ps-btn{padding:0.5rem 1.5rem;border:none;background:transparent;border-radius:var(--radius-full);font-size:0.85rem;font-weight:500;cursor:pointer;color:var(--color-warm-brown-light);transition:all var(--transition);}
    .ps-btn.active{background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary));color:white;box-shadow:0 2px 8px rgba(201,133,160,0.3);}

    /* Report header */
    .report-header{background:linear-gradient(135deg,var(--color-dark-bg),#2C1A0A);border-radius:var(--radius-lg);padding:2rem;margin-bottom:1.5rem;color:white;position:relative;overflow:hidden;}
    .report-header::before{content:'';position:absolute;right:-50px;top:-50px;width:250px;height:250px;background:radial-gradient(circle,rgba(201,168,76,0.12) 0%,transparent 70%);border-radius:50%;}
    .rh-label{font-size:0.78rem;color:rgba(255,255,255,0.45);margin-bottom:0.3rem;letter-spacing:0.05em;}
    .rh-title{font-family:var(--font-serif);font-size:1.4rem;font-weight:700;margin-bottom:0.3rem;}
    .rh-range{font-size:0.82rem;color:rgba(255,255,255,0.5);margin-bottom:1.5rem;}
    .rh-stats{display:flex;gap:1.5rem;flex-wrap:wrap;}
    .rhs-item{text-align:center;}
    .rhs-num{font-family:var(--font-serif);font-size:1.6rem;font-weight:700;color:var(--color-gold-light);}
    .rhs-label{font-size:0.65rem;color:rgba(255,255,255,0.4);}
    .score-circle{position:absolute;right:2rem;top:50%;transform:translateY(-50%);width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary),var(--color-gold));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,168,76,0.3);}
    @media(max-width:600px){.score-circle{position:static;transform:none;margin:1.5rem auto 0;}}
    .score-num{font-family:var(--font-serif);font-size:1.8rem;font-weight:700;color:white;line-height:1;}
    .score-label{font-size:0.55rem;color:rgba(255,255,255,0.7);}

    /* Card */
    .info-card{background:white;border-radius:var(--radius-lg);padding:1.5rem;box-shadow:var(--shadow-sm);margin-bottom:1.2rem;}
    .card-title{font-family:var(--font-serif);font-size:1rem;font-weight:700;display:flex;align-items:center;gap:0.5rem;margin-bottom:1.2rem;}
    .card-title::before{content:'';width:3px;height:16px;background:linear-gradient(180deg,var(--color-primary),var(--color-gold));border-radius:2px;}

    /* Bar chart */
    .bar-chart{display:flex;align-items:flex-end;gap:4px;height:100px;margin-bottom:0.8rem;}
    .bc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;}
    .bc-bar{width:100%;border-radius:4px 4px 0 0;transition:height 0.8s ease;min-height:2px;position:relative;cursor:pointer;}
    .bc-bar.checked{background:linear-gradient(180deg,var(--color-gold),var(--color-primary));}
    .bc-bar.missed{background:rgba(200,130,100,0.12);}
    .bc-bar.makeup{background:linear-gradient(180deg,var(--color-gold-light),var(--color-gold));}
    .bc-bar:hover{opacity:0.8;}
    .bc-tooltip{position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--color-warm-brown);color:white;font-size:0.6rem;padding:0.15rem 0.4rem;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s;}
    .bc-bar:hover .bc-tooltip{opacity:1;}
    .bc-label{font-size:0.6rem;color:var(--color-warm-brown-light);text-align:center;}

    /* Dimension bars */
    .dim-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.8rem;}
    .dim-item{display:flex;align-items:center;gap:0.8rem;padding:0.6rem;background:var(--color-cream);border-radius:var(--radius-sm);}
    .dim-icon{font-size:1.2rem;flex-shrink:0;}
    .dim-info{flex:1;min-width:0;}
    .dim-name{font-size:0.78rem;font-weight:600;margin-bottom:0.2rem;}
    .dim-bar-wrap{height:8px;background:rgba(200,130,100,0.1);border-radius:4px;overflow:hidden;}
    .dim-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;}
    .dim-val{font-size:0.78rem;font-weight:700;color:var(--color-warm-brown);min-width:40px;text-align:right;}

    /* Line chart (CSS art) */
    .line-chart{position:relative;height:140px;margin-bottom:0.5rem;border-bottom:1px solid rgba(200,130,100,0.1);border-left:1px solid rgba(200,130,100,0.1);}
    .lc-point{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid white;box-shadow:var(--shadow-sm);transform:translate(-50%,50%);cursor:pointer;transition:all var(--transition);}
    .lc-point:hover{transform:translate(-50%,50%) scale(1.4);}
    .lc-point .lc-tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--color-warm-brown);color:white;font-size:0.6rem;padding:0.15rem 0.5rem;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;}
    .lc-point:hover .lc-tip{opacity:1;}
    .lc-line{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;}
    .lc-labels{display:flex;justify-content:space-between;padding:0.3rem 0;font-size:0.6rem;color:var(--color-warm-brown-light);}

    /* Sleep chart */
    .sleep-bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:0.5rem;}
    .sb-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
    .sb-bar{width:100%;border-radius:4px 4px 0 0;transition:height 0.8s ease;min-height:2px;cursor:pointer;position:relative;}
    .sb-bar:hover{opacity:0.8;}
    .sb-tooltip{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--color-warm-brown);color:white;font-size:0.6rem;padding:0.15rem 0.4rem;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;}
    .sb-bar:hover .sb-tooltip{opacity:1;}
    .sb-label{font-size:0.58rem;color:var(--color-warm-brown-light);}

    /* Skin trend grid */
    .skin-trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-bottom:1rem;}
    .stg-cell{aspect-ratio:1;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:0.9rem;cursor:pointer;transition:all var(--transition);position:relative;}
    .stg-cell:hover{transform:scale(1.1);z-index:1;}
    .stg-cell .stg-tip{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);background:var(--color-warm-brown);color:white;font-size:0.58rem;padding:0.1rem 0.4rem;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2;}
    .stg-cell:hover .stg-tip{opacity:1;}

    /* Skin legend */
    .skin-legend{display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:1rem;}
    .skin-legend-item{display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;color:var(--color-warm-brown-light);}
    .skin-legend-dot{width:12px;height:12px;border-radius:3px;}

    /* Suggestion */
    .suggestions{display:flex;flex-direction:column;gap:0.6rem;}
    .sug-item{display:flex;gap:0.8rem;padding:0.8rem;background:var(--color-cream);border-radius:var(--radius-sm);}
    .sug-icon{font-size:1.3rem;flex-shrink:0;}
    .sug-text h4{font-size:0.85rem;font-weight:600;margin-bottom:0.1rem;}
    .sug-text p{font-size:0.78rem;color:var(--color-warm-brown-light);line-height:1.5;}

    /* Share */
    .share-card{background:linear-gradient(135deg,rgba(232,180,197,0.15),rgba(201,168,76,0.1));border:1px solid rgba(201,168,76,0.2);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;margin-bottom:1.2rem;}
    .btn-share{padding:0.7rem 2rem;background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary));color:white;border:none;border-radius:var(--radius-full);font-size:0.9rem;font-weight:600;cursor:pointer;transition:all var(--transition);}
    .btn-share:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

    /* Toast */
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--color-warm-brown);color:white;padding:0.7rem 1.5rem;border-radius:var(--radius-full);font-size:0.85rem;z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .info-card{animation:fadeInUp 0.5s ease both;}
    .info-card:nth-child(2){animation-delay:0.05s;}
    .info-card:nth-child(3){animation-delay:0.1s;}
    .info-card:nth-child(4){animation-delay:0.15s;}
    .info-card:nth-child(5){animation-delay:0.2s;}
    .info-card:nth-child(6){animation-delay:0.25s;}
    .info-card:nth-child(7){animation-delay:0.3s;}
    .info-card:nth-child(8){animation-delay:0.35s;}

    .no-data{text-align:center;padding:2rem;color:var(--color-warm-brown-light);font-size:0.85rem;}
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand"><div class="brand-icon">🌸</div><span class="brand-name">七白润光</span></a>
  <div class="nav-links">
    <a href="checkin.html">📋 去打卡</a>
    <a href="tech.html">🔬 研发工艺</a>
    <a href="member.html">👤 会员中心</a>
  </div>
</nav>
<div class="toast" id="toast"></div>

<main class="page-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:0.5rem;">
    <h1 style="font-family:var(--font-serif);font-size:1.5rem;font-weight:700;">食养报告</h1>
    <div class="period-switch">
      <button class="ps-btn active" onclick="switchPeriod(this,'week')">周报</button>
      <button class="ps-btn" onclick="switchPeriod(this,'month')">月报</button>
    </div>
  </div>

  <!-- Report header -->
  <div class="report-header">
    <div class="rh-label">七白润光 · 食养追踪报告</div>
    <div class="rh-title" id="rh-title">本周食养报告</div>
    <div class="rh-range" id="rh-range"></div>
    <div class="rh-stats">
      <div class="rhs-item"><div class="rhs-num" id="rh-checkins">0</div><div class="rhs-label">打卡天数</div></div>
      <div class="rhs-item"><div class="rhs-num" id="rh-streak">0</div><div class="rhs-label">最长连续</div></div>
      <div class="rhs-item"><div class="rhs-num" id="rh-rate">0%</div><div class="rhs-label">完成率</div></div>
      <div class="rhs-item"><div class="rhs-num" id="rh-pts">0</div><div class="rhs-label">获得积分</div></div>
      <div class="rhs-item"><div class="rhs-num" id="rh-water">0ml</div><div class="rhs-label">日均饮水</div></div>
      <div class="rhs-item"><div class="rhs-num" id="rh-sleep">0h</div><div class="rhs-label">日均睡眠</div></div>
    </div>
    <div class="score-circle"><div class="score-num" id="score-num">--</div><div class="score-label">食养评分</div></div>
  </div>

  <!-- Checkin bar chart -->
  <div class="info-card">
    <div class="card-title">打卡完成率</div>
    <div class="bar-chart" id="bar-chart"></div>
    <div style="display:flex;gap:1.2rem;font-size:0.72rem;color:var(--color-warm-brown-light);">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:linear-gradient(var(--color-gold),var(--color-primary));margin-right:4px;"></span>正常打卡</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:linear-gradient(var(--color-gold-light),var(--color-gold));margin-right:4px;"></span>补卡</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(200,130,100,0.12);margin-right:4px;"></span>未打卡</span>
    </div>
  </div>

  <!-- Dimensions -->
  <div class="info-card">
    <div class="card-title">食养维度分析</div>
    <div class="dim-bars" id="dim-bars"></div>
  </div>

  <!-- Water trend -->
  <div class="info-card">
    <div class="card-title">💧 饮水趋势</div>
    <div class="line-chart" id="water-chart"></div>
    <div class="lc-labels" id="water-labels"></div>
    <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--color-warm-brown-light);margin-top:0.3rem;">
      <span>日均：<strong id="water-avg">0</strong>ml</span>
      <span>达标率：<strong id="water-goal-pct">0</strong>%</span>
      <span>最高：<strong id="water-max">0</strong>ml</span>
    </div>
  </div>

  <!-- Sleep trend -->
  <div class="info-card">
    <div class="card-title">😴 睡眠趋势</div>
    <div class="sleep-bars" id="sleep-chart"></div>
    <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--color-warm-brown-light);margin-top:0.3rem;">
      <span>日均：<strong id="sleep-avg">0</strong>h</span>
      <span>达标率(≥7h)：<strong id="sleep-goal-pct">0</strong>%</span>
      <span>最早入睡：<strong id="sleep-earliest">--</strong></span>
    </div>
  </div>

  <!-- Skin trend -->
  <div class="info-card">
    <div class="card-title">🌸 肤质变化趋势</div>
    <p style="font-size:0.82rem;color:var(--color-warm-brown-light);margin-bottom:0.8rem;">基于您的每日肤质日记生成</p>
    <div class="skin-legend" id="skin-legend"></div>
    <div class="skin-trend-grid" id="skin-trend-grid"></div>
    <div id="skin-no-data" class="no-data" style="display:none;">暂无肤质记录，前往打卡页面记录每日肤质状态</div>
  </div>

  <!-- Suggestions -->
  <div class="info-card">
    <div class="card-title">💡 AI食养建议</div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <!-- Share -->
  <div class="share-card">
    <div style="font-size:1.5rem;margin-bottom:0.5rem;">📊</div>
    <div style="font-family:var(--font-serif);font-size:1rem;font-weight:700;margin-bottom:0.3rem;">分享您的食养成果</div>
    <div style="font-size:0.82rem;color:var(--color-warm-brown-light);margin-bottom:1rem;">晒出您的打卡报告，激励更多人开启食养之旅</div>
    <button class="btn-share" onclick="shareReport()">📤 生成分享图</button>
  </div>
</main>

<script>
  function showToast(msg) { const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500); }

  let currentPeriod = 'week';
  const checkins = JSON.parse(localStorage.getItem('qibai_checkins') || '[]');
  const skinRecords = JSON.parse(localStorage.getItem('qibai_skin_records') || '[]');
  const waterData = JSON.parse(localStorage.getItem('qibai_water') || '{}');
  const sleepData = JSON.parse(localStorage.getItem('qibai_sleep') || '{}');

  const SKIN_COLORS = {
    '光泽感十足':'#FFD700','水润嫩滑':'#4FC3F7','状态一般':'#BDBDBD',
    '有些暗沉':'#A1887F','偏油出痘':'#FF8A65','干燥起皮':'#FFCC80','敏感泛红':'#EF9A9A'
  };
  const SKIN_SCORES = {
    '光泽感十足':95,'水润嫩滑':85,'状态一般':60,
    '有些暗沉':45,'偏油出痘':40,'干燥起皮':35,'敏感泛红':30
  };

  function switchPeriod(el, period) {
    document.querySelectorAll('.ps-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentPeriod = period;
    renderReport();
  }

  function getDateRange(period) {
    const today = new Date();
    const end = new Date(today);
    let start, days;
    if (period === 'week') {
      days = 7; start = new Date(today); start.setDate(today.getDate() - 6);
    } else {
      days = 30; start = new Date(today); start.setDate(today.getDate() - 29);
    }
    return { start, end, days };
  }

  function calcSleepDuration(sleepTime, wakeTime) {
    const [sh, sm] = sleepTime.split(':').map(Number);
    const [wh, wm] = wakeTime.split(':').map(Number);
    let sMin = sh * 60 + sm, wMin = wh * 60 + wm;
    if (wMin <= sMin) wMin += 24 * 60;
    return (wMin - sMin) / 60;
  }

  function fmt(d) { return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
  function fmtS(d) { return (d.getMonth()+1)+'/'+d.getDate(); }

  function renderReport() {
    const { start, end, days } = getDateRange(currentPeriod);
    document.getElementById('rh-title').textContent = currentPeriod === 'week' ? '本周食养报告' : '近30天月报';
    document.getElementById('rh-range').textContent = fmt(start) + ' — ' + fmt(end);

    const dateList = [];
    const d = new Date(start);
    while (d <= end) { dateList.push(new Date(d)); d.setDate(d.getDate() + 1); }

    const checkinMap = {};
    checkins.forEach(c => { checkinMap[c.date || new Date(c.ts).toDateString()] = c; });
    const doneInPeriod = dateList.filter(dt => checkinMap[dt.toDateString()]).length;
    const rate = Math.round(doneInPeriod / days * 100);

    let maxStreak = 0, cur = 0;
    dateList.forEach(dt => {
      if (checkinMap[dt.toDateString()]) { cur++; if(cur>maxStreak) maxStreak=cur; } else cur = 0;
    });

    const pts = checkins.filter(c => {
      const cd = c.date || new Date(c.ts).toDateString();
      return dateList.some(dt => dt.toDateString() === cd);
    }).reduce((s, c) => s + (c.pts || 5), 0);

    let waterTotal = 0, waterDays = 0, sleepTotal = 0, sleepDays = 0;
    dateList.forEach(dt => {
      const dk = dt.toDateString();
      const wd = waterData[dk];
      if (wd && wd.ml > 0) { waterTotal += wd.ml; waterDays++; }
      const sd = sleepData[dk];
      if (sd) { sleepTotal += calcSleepDuration(sd.sleep, sd.wake); sleepDays++; }
    });
    const waterAvg = waterDays ? Math.round(waterTotal / waterDays) : 0;
    const sleepAvg = sleepDays ? (sleepTotal / sleepDays).toFixed(1) : '0';
    const waterGoalPct = days ? Math.round(dateList.filter(dt => { const wd = waterData[dt.toDateString()]; return wd && wd.ml >= 2000; }).length / days * 100) : 0;
    const sleepGoalPct = days ? Math.round(dateList.filter(dt => { const sd = sleepData[dt.toDateString()]; return sd && calcSleepDuration(sd.sleep, sd.wake) >= 7; }).length / days * 100) : 0;

    const score = Math.min(100, Math.round(
      rate * 0.3 + Math.min(100, waterGoalPct) * 0.2 + Math.min(100, sleepGoalPct) * 0.2 +
      (maxStreak / days * 100) * 0.15 + (doneInPeriod >= days * 0.8 ? 15 : doneInPeriod / days * 15)
    ));

    document.getElementById('rh-checkins').textContent = doneInPeriod;
    document.getElementById('rh-streak').textContent = maxStreak;
    document.getElementById('rh-rate').textContent = rate + '%';
    document.getElementById('rh-pts').textContent = '+' + pts;
    document.getElementById('rh-water').textContent = waterAvg + 'ml';
    document.getElementById('rh-sleep').textContent = sleepAvg + 'h';
    document.getElementById('score-num').textContent = score;

    // Bar chart
    const barDays = currentPeriod === 'week' ? dateList : dateList.slice(-14);
    document.getElementById('bar-chart').innerHTML = barDays.map(dt => {
      const key = dt.toDateString();
      const c = checkinMap[key];
      const done = !!c, isMakeup = c && c.makeup;
      const h = done ? (50 + Math.random() * 50) : (3 + Math.random() * 10);
      return '<div class="bc-col"><div class="bc-bar '+(isMakeup?'makeup':done?'checked':'missed')+'" style="height:'+h+'px;"><div class="bc-tooltip">'+fmtS(dt)+' '+(done?(isMakeup?'补卡':'打卡'):'未打卡')+'</div></div><div class="bc-label">'+dt.getDate()+'日</div></div>';
    }).join('');

    // Dimension bars
    const dims = [
      { name:'🍬 软糖服用', icon:'🍬', val: Math.min(100, rate + 5), color:'var(--color-primary)' },
      { name:'💧 饮水达标', icon:'💧', val: waterGoalPct, color:'#0288D1' },
      { name:'😴 作息规律', icon:'😴', val: sleepGoalPct, color:'#7E57C2' },
      { name:'☀️ 防晒坚持', icon:'☀️', val: Math.min(100, rate * 0.85 + Math.random()*10), color:'#FF9800' },
      { name:'🌿 情绪管理', icon:'🌿', val: Math.min(100, rate * 0.8 + Math.random()*15), color:'#4CAF50' },
      { name:'🔥 打卡连续', icon:'🔥', val: Math.min(100, maxStreak / Math.max(1,days) * 100 * 2), color:'var(--color-gold)' }
    ];
    document.getElementById('dim-bars').innerHTML = dims.map(d => '<div class="dim-item"><div class="dim-icon">'+d.icon+'</div><div class="dim-info"><div class="dim-name">'+d.name+'</div><div class="dim-bar-wrap"><div class="dim-bar-fill" style="width:'+Math.max(3,d.val)+'%;background:'+d.color+';"></div></div></div><div class="dim-val">'+Math.round(Math.max(0,d.val))+'</div></div>').join('');

    // Water trend
    const wDays = currentPeriod === 'week' ? dateList : dateList.filter((_, i) => i % 2 === 0 || i === dateList.length - 1);
    const waterVals = wDays.map(dt => { const wd = waterData[dt.toDateString()]; return wd ? wd.ml : 0; });
    const maxWater = Math.max(2500, ...waterVals);
    let wHtml = '<svg class="lc-line" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">';
    if (waterVals.some(v => v > 0)) {
      const pts = waterVals.map((v, i) => (i / Math.max(1, waterVals.length - 1)) * 100+','+(100 - (v / maxWater * 85))).join(' ');
      wHtml += '<polygon points="0,100 '+pts+' 100,100" fill="url(#wGrad)" opacity="0.3"/>';
      wHtml += '<polyline points="'+pts+'" fill="none" stroke="#0288D1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      wHtml += '<line x1="0" y1="'+(100-2000/maxWater*85)+'" x2="100" y2="'+(100-2000/maxWater*85)+'" stroke="#0288D1" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.5"/>';
      wHtml += '<defs><linearGradient id="wGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:#0288D1;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#0288D1;stop-opacity:0"/></linearGradient></defs>';
    }
    wHtml += '</svg>';
    waterVals.forEach((v, i) => {
      if (v <= 0) return;
      const x = (i / Math.max(1, waterVals.length - 1)) * 100;
      const y = 100 - (v / maxWater * 85);
      wHtml += '<div class="lc-point" style="left:'+x+'%;bottom:'+y+'%;background:#0288D1;"><div class="lc-tip">'+fmtS(wDays[i])+' '+v+'ml</div></div>';
    });
    document.getElementById('water-chart').innerHTML = wHtml;
    document.getElementById('water-labels').innerHTML = wDays.map(dt => '<span>'+dt.getDate()+'日</span>').join('');
    document.getElementById('water-avg').textContent = waterAvg;
    document.getElementById('water-goal-pct').textContent = waterGoalPct;
    document.getElementById('water-max').textContent = Math.max(...waterVals, 0);

    // Sleep bars
    const slDays = dateList.slice(-14);
    const sleepVals = slDays.map(dt => { const sd = sleepData[dt.toDateString()]; return sd ? calcSleepDuration(sd.sleep, sd.wake) : 0; });
    const maxSl = 12;
    document.getElementById('sleep-chart').innerHTML = sleepVals.map((v, i) => {
      const h = v > 0 ? (v / maxSl * 100) : 3;
      const color = v >= 7 ? 'linear-gradient(180deg,#7E57C2,#B39DDB)' : v > 0 ? 'linear-gradient(180deg,#FF9800,#FFE0B2)' : 'rgba(200,130,100,0.1)';
      return '<div class="sb-col"><div class="sb-bar" style="height:'+h+'%;background:'+color+';"><div class="sb-tooltip">'+fmtS(slDays[i])+' '+(v>0?v.toFixed(1)+'h':'未记录')+'</div></div><div class="sb-label">'+slDays[i].getDate()+'</div></div>';
    }).join('');
    document.getElementById('sleep-avg').textContent = sleepAvg + 'h';
    document.getElementById('sleep-goal-pct').textContent = sleepGoalPct + '%';
    let earliestSleep = '--';
    dateList.forEach(dt => { const sd = sleepData[dt.toDateString()]; if (sd && (earliestSleep === '--' || sd.sleep < earliestSleep)) earliestSleep = sd.sleep; });
    document.getElementById('sleep-earliest').textContent = earliestSleep;

    // Skin trend
    const periodSkinRecs = skinRecords.filter(r => { const rd = new Date(r.date); return rd >= start && rd <= end; });
    const skinGrid = document.getElementById('skin-trend-grid');
    const skinNoData = document.getElementById('skin-no-data');
    if (!periodSkinRecs.length) {
      skinGrid.style.display = 'none'; skinNoData.style.display = 'block';
    } else {
      skinGrid.style.display = 'grid'; skinNoData.style.display = 'none';
      const usedStates = [...new Set(periodSkinRecs.map(r => r.state))];
      document.getElementById('skin-legend').innerHTML = usedStates.map(s => '<div class="skin-legend-item"><div class="skin-legend-dot" style="background:'+SKIN_COLORS[s]+';"></div>'+s+'</div>').join('');
      const skinMap = {}; periodSkinRecs.forEach(r => { skinMap[r.date] = r; });
      const sEmoji = {'光泽感十足':'✨','水润嫩滑':'💧','状态一般':'😐','有些暗沉':'😶','偏油出痘':'😟','干燥起皮':'🏜️','敏感泛红':'🔴'};
      skinGrid.innerHTML = dateList.map(dt => {
        const rec = skinMap[dt.toDateString()];
        if (!rec) return '<div class="stg-cell" style="background:rgba(200,130,100,0.06);"><div class="stg-tip">'+fmtS(dt)+' 未记录</div></div>';
        const bg = SKIN_COLORS[rec.state] || '#ccc';
        return '<div class="stg-cell" style="background:'+bg+'30;border:1.5px solid '+bg+';">'+(sEmoji[rec.state]||'🌸')+'<div class="stg-tip">'+fmtS(dt)+' '+rec.state+'</div></div>';
      }).join('');
    }

    // Suggestions
    const allSugs = [
      { icon:'💧', title:'继续保持饮水习惯', text:'日均饮水'+waterAvg+'ml，'+(waterGoalPct>=70?'保持得很好！':'建议提高到2000ml以上。')+'充足水分是食养成分发挥效果的基础。' },
      { icon:'😴', title:'优化作息时间', text:'日均睡眠'+sleepAvg+'h，'+(parseFloat(sleepAvg)>=7?'睡眠充足，继续坚持！':'建议在23点前入睡，保证7-9小时睡眠。') },
      { icon:'☀️', title:'加强防晒意识', text:'防晒是抗氧化食养的重要辅助，每日外出请涂抹SPF30+防晒产品，保护食养成果。' },
      { icon:'🥦', title:'搭配抗氧化饮食', text:'多摄入富含维生素C和E的食物（如猕猴桃、蓝莓、坚果），与七白软糖形成协同效应。' },
      { icon:'📈', title:'坚持当前节奏', text:'您的完成率为'+rate+'%，连续'+maxStreak+'天打卡。'+(rate>=80?'太棒了！效果将在第2-3周明显显现。':'加油！尽量每天打卡，食养需要坚持。') },
      { icon:'🌸', title:'关注肤质变化', text: periodSkinRecs.length>0?'记录了'+periodSkinRecs.length+'天肤质，'+(periodSkinRecs.filter(r=>SKIN_SCORES[r.state]>=70).length>=periodSkinRecs.length/2?'整体状态向好！':'部分日期状态不佳，注意作息和饮食。'):'建议每天记录肤质状态，帮助追踪食养效果变化趋势。' },
    ];
    let sugs;
    if (rate < 30) sugs = [allSugs[4],allSugs[1],allSugs[2]];
    else if (waterGoalPct < 50) sugs = [allSugs[0],allSugs[4],allSugs[2]];
    else if (parseFloat(sleepAvg) < 6.5) sugs = [allSugs[1],allSugs[0],allSugs[4]];
    else sugs = [allSugs[4],allSugs[0],allSugs[5]];
    document.getElementById('suggestions').innerHTML = sugs.map(s => '<div class="sug-item"><div class="sug-icon">'+s.icon+'</div><div class="sug-text"><h4>'+s.title+'</h4><p>'+s.text+'</p></div></div>').join('');
  }

  function shareReport() { showToast('分享功能开发中，敬请期待 📱'); }

  renderReport();
</script>
</body>
</html>
