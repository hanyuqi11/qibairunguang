<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册 · 七白润光</title>
  <style>
    :root {
      --color-primary: #E8B4C5; --color-primary-light: #F5D5E0; --color-primary-dark: #C985A0;
      --color-gold: #C9A84C; --color-gold-dark: #A07830;
      --color-ivory: #FDFAF5; --color-cream: #FEF6EC;
      --color-warm-brown: #6B4226; --color-warm-brown-light: #A0704A;
      --font-serif: 'Noto Serif SC','SimSun',Georgia,serif;
      --font-sans: 'PingFang SC','Microsoft YaHei',sans-serif;
      --radius-sm:8px; --radius-md:16px; --radius-lg:24px; --radius-full:9999px;
      --shadow-sm: 0 2px 8px rgba(200,130,100,0.1);
      --shadow-md: 0 8px 32px rgba(200,130,100,0.15);
      --shadow-lg: 0 20px 60px rgba(200,130,100,0.2);
      --transition: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{
      font-family:var(--font-sans);
      background:linear-gradient(160deg,#FEF2F8 0%,var(--color-cream) 40%,#FFF8EE 100%);
      color:var(--color-warm-brown);min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:2rem 1rem;
    }
    a{text-decoration:none;color:inherit;}
    button{cursor:pointer;font-family:inherit;}

    /* Decorative background */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(232,180,197,0.2) 0%, transparent 50%),
        radial-gradient(circle at 85% 75%, rgba(201,168,76,0.12) 0%, transparent 50%);
      pointer-events:none;z-index:0;
    }

    .login-container{position:relative;z-index:1;width:100%;max-width:420px;}

    /* Header */
    .login-header{text-align:center;margin-bottom:2rem;}
    .brand-logo{display:inline-flex;align-items:center;gap:0.6rem;margin-bottom:1rem;text-decoration:none;}
    .brand-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--color-primary),var(--color-gold));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 4px 16px rgba(201,133,160,0.3);}
    .brand-name{font-family:var(--font-serif);font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--color-warm-brown),var(--color-gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .login-title{font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:var(--color-warm-brown);margin-bottom:0.4rem;}
    .login-sub{font-size:0.85rem;color:var(--color-warm-brown-light);}

    /* Card */
    .login-card{
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(20px);
      border-radius:var(--radius-lg);
      border:1px solid rgba(201,168,76,0.15);
      box-shadow:var(--shadow-lg);
      overflow:hidden;
    }

    /* Tabs */
    .login-tabs{display:flex;border-bottom:1px solid rgba(201,168,76,0.12);}
    .login-tab{flex:1;padding:1rem;border:none;background:transparent;font-size:0.9rem;font-weight:500;color:var(--color-warm-brown-light);cursor:pointer;transition:all var(--transition);border-bottom:2px solid transparent;margin-bottom:-1px;}
    .login-tab.active{color:var(--color-warm-brown);border-bottom-color:var(--color-primary-dark);font-weight:700;}

    /* Form Body */
    .login-body{padding:2rem;}
    .panel{display:none;}
    .panel.active{display:flex;flex-direction:column;gap:1.1rem;}

    /* Form fields */
    .form-group{display:flex;flex-direction:column;gap:0.4rem;}
    .form-label{font-size:0.82rem;font-weight:600;color:var(--color-warm-brown);}
    .form-input-wrap{position:relative;}
    .form-input{
      width:100%;padding:0.8rem 1rem;
      border:1.5px solid rgba(201,168,76,0.2);
      border-radius:var(--radius-md);font-size:0.9rem;
      outline:none;transition:all var(--transition);
      background:rgba(253,250,245,0.6);
      color:var(--color-warm-brown);
    }
    .form-input:focus{border-color:var(--color-primary-dark);background:white;box-shadow:0 0 0 3px rgba(201,133,160,0.1);}
    .form-input.error{border-color:#E53E3E;}
    .error-msg{font-size:0.75rem;color:#E53E3E;display:none;}
    .error-msg.show{display:block;}

    /* Code input row */
    .code-row{display:flex;gap:0.5rem;}
    .code-row .form-input{flex:1;}
    .btn-send-code{
      padding:0.8rem 1rem;white-space:nowrap;flex-shrink:0;
      background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary));
      color:white;border:none;border-radius:var(--radius-md);
      font-size:0.82rem;font-weight:600;transition:all var(--transition);
      min-width:90px;
    }
    .btn-send-code:hover:not(:disabled){opacity:0.88;}
    .btn-send-code:disabled{background:rgba(201,168,76,0.2);color:var(--color-warm-brown-light);}

    /* Avatar Select */
    .avatar-select{display:flex;gap:0.75rem;flex-wrap:wrap;}
    .avatar-opt{
      width:44px;height:44px;border-radius:50%;
      border:2px solid transparent;font-size:1.4rem;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;background:rgba(232,180,197,0.1);
      transition:all var(--transition);
    }
    .avatar-opt.selected{border-color:var(--color-primary-dark);background:rgba(232,180,197,0.2);box-shadow:0 0 0 3px rgba(201,133,160,0.15);}
    .avatar-opt:hover{transform:scale(1.1);}

    /* Skin type */
    .skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;}
    .skin-btn{
      padding:0.65rem 0.5rem;border:1.5px solid rgba(201,168,76,0.2);
      border-radius:var(--radius-sm);background:white;
      font-size:0.78rem;font-weight:500;color:var(--color-warm-brown-light);
      text-align:center;cursor:pointer;transition:all var(--transition);
    }
    .skin-btn:hover{border-color:var(--color-primary);}
    .skin-btn.selected{border-color:var(--color-primary-dark);background:rgba(232,180,197,0.1);color:var(--color-primary-dark);font-weight:600;}

    /* Main Button */
    .btn-main{
      width:100%;padding:1rem;
      background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary),var(--color-gold));
      color:white;border:none;border-radius:var(--radius-full);
      font-size:1rem;font-weight:700;letter-spacing:0.05em;
      box-shadow:0 6px 25px rgba(201,133,160,0.35);
      transition:all var(--transition);
    }
    .btn-main:hover{transform:translateY(-2px);box-shadow:0 10px 35px rgba(201,133,160,0.45);}
    .btn-main:disabled{opacity:0.55;pointer-events:none;}

    /* Divider */
    .divider{display:flex;align-items:center;gap:0.75rem;color:var(--color-warm-brown-light);font-size:0.8rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(201,168,76,0.15);}

    /* WeChat btn */
    .btn-wechat{
      width:100%;padding:0.85rem;
      background:rgba(9,187,7,0.08);border:1.5px solid rgba(9,187,7,0.2);
      color:#1a6b18;border-radius:var(--radius-full);
      font-size:0.9rem;font-weight:600;
      display:flex;align-items:center;justify-content:center;gap:0.5rem;
      transition:all var(--transition);
    }
    .btn-wechat:hover{background:rgba(9,187,7,0.12);}

    /* Agreement */
    .agreement{font-size:0.76rem;color:var(--color-warm-brown-light);text-align:center;line-height:1.6;}
    .agreement a{color:var(--color-gold-dark);font-weight:500;}

    /* Step indicator in register */
    .reg-steps{display:flex;justify-content:center;gap:0.5rem;margin-bottom:1.25rem;}
    .reg-step-dot{width:8px;height:8px;border-radius:50%;background:rgba(201,168,76,0.2);transition:all var(--transition);}
    .reg-step-dot.active{background:var(--color-primary-dark);width:24px;border-radius:4px;}
    .reg-step-dot.done{background:rgba(72,187,120,0.5);}

    /* Success State */
    .login-success{padding:2rem;text-align:center;display:none;}
    .login-success.show{display:block;}
    .success-avatar{font-size:4rem;margin-bottom:0.75rem;}
    .success-welcome{font-family:var(--font-serif);font-size:1.25rem;font-weight:700;margin-bottom:0.4rem;}
    .success-msg{font-size:0.85rem;color:var(--color-warm-brown-light);margin-bottom:1.5rem;}
    .success-actions{display:flex;flex-direction:column;gap:0.6rem;}

    /* Back link */
    .back-link{text-align:center;margin-top:1.25rem;font-size:0.82rem;color:var(--color-warm-brown-light);}
    .back-link a{color:var(--color-gold-dark);font-weight:500;}

    /* Toast */
    .toast{position:fixed;bottom:2rem;right:2rem;z-index:9999;padding:0.85rem 1.5rem;background:#1A1208;color:white;border-radius:var(--radius-md);font-size:0.88rem;font-weight:500;box-shadow:var(--shadow-lg);transform:translateY(100px);opacity:0;transition:all 0.3s ease;pointer-events:none;}
    .toast.show{transform:translateY(0);opacity:1;}

    @media(max-width:480px){
      .skin-grid{grid-template-columns:repeat(2,1fr);}
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Header -->
    <div class="login-header">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🌸</div>
        <span class="brand-name">七白润光</span>
      </a>
      <div class="login-title" id="formTitle">欢迎回来</div>
      <div class="login-sub" id="formSub">登录账户，开启食养旅程</div>
    </div>

    <!-- Card -->
    <div class="login-card" id="loginCard">
      <!-- Tabs -->
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('login')">登录</button>
        <button class="login-tab" onclick="switchTab('register')">注册</button>
      </div>

      <!-- Login Panel -->
      <div class="login-body">
        <div class="panel active" id="panelLogin">
          <div class="form-group">
            <label class="form-label">手机号</label>
            <input type="tel" class="form-input" id="loginPhone" placeholder="请输入手机号" maxlength="11">
          </div>
          <div class="form-group">
            <label class="form-label">验证码</label>
            <div class="code-row">
              <input type="text" class="form-input" id="loginCode" placeholder="请输入验证码" maxlength="6">
              <button class="btn-send-code" id="loginSendCode" onclick="sendCode('loginPhone','loginCountdown')">获取验证码</button>
            </div>
            <span class="error-msg" id="loginCodeError">验证码错误，请重新获取</span>
            <div style="font-size:0.74rem;color:var(--color-warm-brown-light);margin-top:0.2rem;">演示码：<strong>123456</strong></div>
          </div>
          <button class="btn-main" onclick="doLogin()">🌸 登录</button>
          <div class="agreement" style="margin-top:0.5rem;">
            <label style="display:flex;align-items:flex-start;gap:0.4rem;cursor:pointer;">
              <input type="checkbox" id="loginAgree" style="margin-top:2px;accent-color:var(--color-primary-dark);">
              <span>登录即表示同意<a href="compliance.html#terms">《用户协议》</a>和<a href="compliance.html#privacy">《隐私政策》</a></span>
            </label>
          </div>
          <div style="text-align:right;margin-top:0.3rem;">
            <a href="javascript:void(0)" onclick="showForgotPassword()" style="font-size:0.78rem;color:var(--color-gold-dark);">忘记密码？</a>
          </div>
          <div class="divider">或</div>
          <button class="btn-wechat" onclick="showToast('微信登录功能即将上线～')">
            💬 微信一键登录（即将开放）
          </button>
        </div>

        <!-- Register Panel -->
        <div class="panel" id="panelRegister">
          <!-- Steps dots -->
          <div class="reg-steps">
            <div class="reg-step-dot active" id="rsd0"></div>
            <div class="reg-step-dot" id="rsd1"></div>
            <div class="reg-step-dot" id="rsd2"></div>
          </div>

          <!-- Step 1: Phone -->
          <div id="regStep1">
            <div class="form-group">
              <label class="form-label">手机号</label>
              <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" maxlength="11">
            </div>
            <div class="form-group">
              <label class="form-label">验证码</label>
              <div class="code-row">
                <input type="text" class="form-input" id="regCode" placeholder="请输入验证码" maxlength="6">
                <button class="btn-send-code" id="regSendCode" onclick="sendCode('regPhone','regCountdown')">获取验证码</button>
              </div>
              <div style="font-size:0.74rem;color:var(--color-warm-brown-light);margin-top:0.2rem;">演示码：<strong>123456</strong></div>
            </div>
            <button class="btn-main" onclick="regNextStep(2)">下一步</button>
          </div>

          <!-- Step 2: Profile -->
          <div id="regStep2" style="display:none">
            <div class="form-group">
              <label class="form-label">选择头像</label>
              <div class="avatar-select" id="avatarSelect">
                <div class="avatar-opt selected" data-avatar="🌸">🌸</div>
                <div class="avatar-opt" data-avatar="🌙">🌙</div>
                <div class="avatar-opt" data-avatar="✨">✨</div>
                <div class="avatar-opt" data-avatar="🌿">🌿</div>
                <div class="avatar-opt" data-avatar="💎">💎</div>
                <div class="avatar-opt" data-avatar="🍄">🍄</div>
                <div class="avatar-opt" data-avatar="🌺">🌺</div>
                <div class="avatar-opt" data-avatar="🦋">🦋</div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">昵称</label>
              <input type="text" class="form-input" id="regNickname" placeholder="你的昵称（2-10字）" maxlength="10">
            </div>
            <button class="btn-main" onclick="regNextStep(3)">下一步</button>
          </div>

          <!-- Step 3: Skin Type -->
          <div id="regStep3" style="display:none">
            <div class="form-group">
              <label class="form-label" style="margin-bottom:0.6rem">你的肤质类型（可多选）</label>
              <div class="skin-grid" id="skinGrid">
                <div class="skin-btn" data-skin="干皮">🌵 干皮</div>
                <div class="skin-btn" data-skin="油皮">💧 油皮</div>
                <div class="skin-btn" data-skin="混合皮">🌊 混合皮</div>
                <div class="skin-btn" data-skin="敏感皮">🌸 敏感皮</div>
                <div class="skin-btn" data-skin="中性皮">✨ 中性皮</div>
                <div class="skin-btn" data-skin="暂不确定">❓ 不确定</div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">当前主要关注（选填）</label>
              <div class="skin-grid">
                <div class="skin-btn" data-concern="日常养护">🌿 日常养护</div>
                <div class="skin-btn" data-concern="均匀肤色">🌟 均匀肤色</div>
                <div class="skin-btn" data-concern="改善暗沉">☀️ 改善暗沉</div>
                <div class="skin-btn" data-concern="控油保湿">💧 控油保湿</div>
                <div class="skin-btn" data-concern="建立习惯">📅 建立习惯</div>
                <div class="skin-btn" data-concern="食养了解">📚 食养了解</div>
              </div>
            </div>
            <button class="btn-main" onclick="doRegister()">🌸 完成注册，开始食养之旅</button>
            <div class="agreement" style="margin-top:0.5rem;">
              <label style="display:flex;align-items:flex-start;gap:0.4rem;cursor:pointer;">
                <input type="checkbox" id="regAgree" style="margin-top:2px;accent-color:var(--color-primary-dark);">
                <span>我已阅读并同意<a href="compliance.html#terms">《用户协议》</a>和<a href="compliance.html#privacy">《隐私政策》</a></span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Success State -->
    <div class="login-card login-success" id="loginSuccess">
      <div class="success-avatar" id="successAvatar">🌸</div>
      <div class="success-welcome" id="successWelcome">欢迎回来！</div>
      <div class="success-msg" id="successMsg">已登录账号，正在跳转...</div>
      <div class="success-actions">
        <a href="member.html" class="btn-main" style="display:flex;align-items:center;justify-content:center;">👑 进入会员中心</a>
        <a href="index.html" style="text-align:center;font-size:0.85rem;color:var(--color-warm-brown-light);padding:0.5rem;">← 返回首页</a>
      </div>
    </div>

    <div class="back-link">
      <a href="index.html">← 返回首页</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentTab = 'login';
    let regCurrentStep = 1;
    let selectedAvatar = '🌸';
    let selectedSkins = [];
    let selectedConcerns = [];

    // ===== Tab Switch =====
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.login-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
      document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
      document.getElementById('formTitle').textContent = tab === 'login' ? '欢迎回来' : '创建账户';
      document.getElementById('formSub').textContent = tab === 'login' ? '登录账户，开启食养旅程' : '加入七白润光，建立食养习惯';
    }

    // ===== Send Code =====
    const timers = {};
    function sendCode(phoneId, countdownId) {
      const phone = document.getElementById(phoneId).value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的11位手机号'); return; }
      const btnId = phoneId === 'loginPhone' ? 'loginSendCode' : 'regSendCode';
      const btn = document.getElementById(btnId);
      let count = 60;
      btn.disabled = true;
      btn.textContent = count + 's';
      const timer = setInterval(() => {
        count--;
        btn.textContent = count + 's';
        if (count <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '重新获取';
        }
      }, 1000);
      showToast('📱 验证码已发送（演示：123456）');
    }

    // ===== Forgot Password =====
    function showForgotPassword() {
      const phone = document.getElementById('loginPhone').value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请先输入手机号'); return; }
      showToast('📱 重置验证码已发送（演示：123456），请输入新验证码完成登录', '');
      document.getElementById('loginCode').value = '';
      document.getElementById('loginCode').focus();
    }

    // ===== Login =====
    function doLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const code = document.getElementById('loginCode').value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确手机号'); return; }
      if (code !== '123456') {
        document.getElementById('loginCode').classList.add('error');
        document.getElementById('loginCodeError').classList.add('show');
        showToast('❌ 验证码错误，演示码：123456');
        return;
      }
      document.getElementById('loginCode').classList.remove('error');
      document.getElementById('loginCodeError').classList.remove('show');
      const agree = document.getElementById('loginAgree');
      if (agree && !agree.checked) { showToast('请先阅读并同意用户协议与隐私政策'); return; }

      // Load or create user
      let user = JSON.parse(localStorage.getItem('qibai_user') || 'null');
      if (!user) {
        user = { phone, avatar: '🌸', nickname: '食养达人', skinType: [], concerns: [], points: 0, level: '白芷会员', joinDate: new Date().toLocaleDateString('zh-CN') };
        localStorage.setItem('qibai_user', JSON.stringify(user));
      }
      showLoginSuccess(user, false);
    }

    // ===== Register Steps =====
    function regNextStep(n) {
      if (n === 2) {
        const phone = document.getElementById('regPhone').value.trim();
        const code = document.getElementById('regCode').value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确手机号'); return; }
        if (code !== '123456') { showToast('❌ 验证码错误，演示码：123456'); return; }
      }
      if (n === 3) {
        const nick = document.getElementById('regNickname').value.trim();
        if (!nick || nick.length < 2) { showToast('请输入2-10字昵称'); return; }
      }
      regCurrentStep = n;
      [1,2,3].forEach(i => {
        document.getElementById('regStep' + i).style.display = i === n ? 'flex' : 'none';
        document.getElementById('regStep' + i).style.flexDirection = 'column';
        document.getElementById('regStep' + i).style.gap = '1.1rem';
        const dot = document.getElementById('rsd' + (i-1));
        if (i < n) dot.className = 'reg-step-dot done';
        else if (i === n) dot.className = 'reg-step-dot active';
        else dot.className = 'reg-step-dot';
      });
    }

    // Avatar Select
    document.querySelectorAll('.avatar-opt').forEach(opt => {
      opt.addEventListener('click', function() {
        document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
        selectedAvatar = this.dataset.avatar;
      });
    });

    // Skin buttons
    document.querySelectorAll('.skin-btn[data-skin]').forEach(btn => {
      btn.addEventListener('click', function() {
        this.classList.toggle('selected');
        const val = this.dataset.skin;
        const idx = selectedSkins.indexOf(val);
        if (idx >= 0) selectedSkins.splice(idx, 1);
        else selectedSkins.push(val);
      });
    });
    document.querySelectorAll('.skin-btn[data-concern]').forEach(btn => {
      btn.addEventListener('click', function() {
        this.classList.toggle('selected');
        const val = this.dataset.concern;
        const idx = selectedConcerns.indexOf(val);
        if (idx >= 0) selectedConcerns.splice(idx, 1);
        else selectedConcerns.push(val);
      });
    });

    // ===== Register =====
    function doRegister() {
      const regAgree = document.getElementById('regAgree');
      if (regAgree && !regAgree.checked) { showToast('请先阅读并同意用户协议与隐私政策'); return; }
      const phone = document.getElementById('regPhone').value.trim();
      const nick = document.getElementById('regNickname').value.trim();
      const user = {
        phone, avatar: selectedAvatar,
        nickname: nick || '食养达人',
        skinType: selectedSkins,
        concerns: selectedConcerns,
        points: 100,
        level: '白芷会员',
        joinDate: new Date().toLocaleDateString('zh-CN'),
        isNew: true
      };
      localStorage.setItem('qibai_user', JSON.stringify(user));
      showLoginSuccess(user, true);
    }

    // ===== Success =====
    function showLoginSuccess(user, isNew) {
      document.getElementById('loginCard').style.display = 'none';
      const s = document.getElementById('loginSuccess');
      s.classList.add('show');
      document.getElementById('successAvatar').textContent = user.avatar || '🌸';
      document.getElementById('successWelcome').textContent = (isNew ? '🎉 注册成功！' : '✅ 登录成功！') + ' ' + (user.nickname || '食养达人');
      document.getElementById('successMsg').textContent = isNew
        ? '新用户礼包：+100积分已到账！欢迎开启21天食养计划～'
        : '欢迎回来！继续您的食养之旅～';
      document.getElementById('formTitle').textContent = '';
      document.getElementById('formSub').textContent = '';

      // Redirect after delay
      const redirect = new URLSearchParams(window.location.search).get('redirect');
      setTimeout(() => {
        window.location.href = redirect || 'member.html';
      }, 2000);
    }

    // ===== Toast =====
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ===== Check already logged in =====
    const user = JSON.parse(localStorage.getItem('qibai_user') || 'null');
    if (user) {
      document.getElementById('loginCard').style.display = 'none';
      const s = document.getElementById('loginSuccess');
      s.classList.add('show');
      document.getElementById('successAvatar').textContent = user.avatar || '🌸';
      document.getElementById('successWelcome').textContent = '已登录：' + (user.nickname || '食养达人');
      document.getElementById('successMsg').textContent = '您已登录账号';
      document.getElementById('formTitle').textContent = '';
      document.getElementById('formSub').textContent = '';
    }
  </script>
</body>
</html>
