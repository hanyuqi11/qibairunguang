<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车 · 七白润光</title>
  <style>
    :root {
      --color-primary: #E8B4C5; --color-primary-light: #F5D5E0; --color-primary-dark: #C985A0;
      --color-gold: #C9A84C; --color-gold-light: #F0D080; --color-gold-dark: #A07830;
      --color-ivory: #FDFAF5; --color-cream: #FEF6EC;
      --color-warm-brown: #6B4226; --color-warm-brown-light: #A0704A;
      --color-dark-bg: #1A1208;
      --font-serif: 'Noto Serif SC','SimSun',Georgia,serif;
      --font-sans: 'PingFang SC','Microsoft YaHei',sans-serif;
      --radius-sm:8px; --radius-md:16px; --radius-lg:24px; --radius-full:9999px;
      --shadow-sm: 0 2px 8px rgba(200,130,100,0.1);
      --shadow-md: 0 8px 32px rgba(200,130,100,0.15);
      --shadow-lg: 0 20px 60px rgba(200,130,100,0.2);
      --transition: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-sans);background:var(--color-ivory);color:var(--color-warm-brown);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    button{cursor:pointer;font-family:inherit;}

    /* Navbar */
    .navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(253,250,245,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,0.12);box-shadow:0 2px 20px rgba(107,66,38,0.06);}
    .brand{display:flex;align-items:center;gap:0.5rem;}
    .brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary),var(--color-gold));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
    .brand-name{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--color-warm-brown),var(--color-gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    /* Layout */
    .page-wrap{max-width:1100px;margin:0 auto;padding:88px 2rem 6rem;}
    .page-title{font-family:var(--font-serif);font-size:1.6rem;font-weight:700;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.6rem;}

    /* Cart Layout */
    .cart-layout{display:grid;grid-template-columns:1fr 340px;gap:1.5rem;align-items:start;}
    @media(max-width:900px){.cart-layout{grid-template-columns:1fr;}}

    /* Cart List */
    .cart-list{display:flex;flex-direction:column;gap:0;background:white;border-radius:var(--radius-lg);border:1px solid rgba(201,168,76,0.1);overflow:hidden;box-shadow:var(--shadow-sm);}
    .cart-header{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid rgba(201,168,76,0.08);background:linear-gradient(135deg,var(--color-ivory),var(--color-cream));}
    .check-all-wrap{display:flex;align-items:center;gap:0.6rem;cursor:pointer;}
    .cart-header-text{font-size:0.82rem;color:var(--color-warm-brown-light);margin-left:auto;}

    /* Checkbox */
    .cb{width:18px;height:18px;flex-shrink:0;appearance:none;-webkit-appearance:none;border:1.5px solid rgba(201,168,76,0.35);border-radius:4px;cursor:pointer;position:relative;transition:all var(--transition);}
    .cb:checked{background:var(--color-primary-dark);border-color:var(--color-primary-dark);}
    .cb:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:0.7rem;font-weight:700;}

    /* Cart Item */
    .cart-item{display:flex;align-items:flex-start;gap:1rem;padding:1.25rem 1.5rem;border-bottom:1px solid rgba(201,168,76,0.06);transition:background var(--transition);}
    .cart-item:last-child{border-bottom:none;}
    .cart-item:hover{background:rgba(232,180,197,0.03);}
    .item-emoji{width:72px;height:72px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0;border:1px solid rgba(201,168,76,0.1);}
    .item-emoji img{width:100%;height:100%;object-fit:cover;}
    .item-details{flex:1;min-width:0;}
    .item-name{font-weight:600;font-size:0.92rem;color:var(--color-warm-brown);margin-bottom:0.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .item-spec{font-size:0.78rem;color:var(--color-warm-brown-light);margin-bottom:0.6rem;}
    .item-spec span{padding:0.15rem 0.5rem;background:rgba(201,168,76,0.08);border-radius:var(--radius-full);}
    .item-price-row{display:flex;align-items:center;gap:1rem;}
    .item-price{font-weight:700;font-size:1rem;color:var(--color-primary-dark);font-family:var(--font-serif);}
    .item-qty-ctrl{display:flex;align-items:center;border:1.5px solid rgba(201,168,76,0.2);border-radius:var(--radius-full);overflow:hidden;}
    .qty-btn{width:30px;height:30px;border:none;background:transparent;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background var(--transition);}
    .qty-btn:hover{background:rgba(232,180,197,0.15);}
    .qty-num{width:36px;text-align:center;font-size:0.85rem;font-weight:600;border:none;outline:none;background:transparent;color:var(--color-warm-brown);}
    .item-subtotal{font-weight:700;font-size:0.95rem;color:var(--color-warm-brown);margin-left:auto;min-width:60px;text-align:right;}
    .btn-delete{border:none;background:none;color:rgba(107,66,38,0.3);font-size:1.1rem;padding:0.25rem;border-radius:var(--radius-sm);transition:all var(--transition);}
    .btn-delete:hover{color:#E53E3E;background:rgba(229,62,62,0.06);}

    /* Empty Cart */
    .cart-empty{padding:4rem 2rem;text-align:center;color:var(--color-warm-brown-light);}
    .cart-empty .empty-icon{font-size:4rem;margin-bottom:1rem;opacity:0.4;}
    .cart-empty p{margin-bottom:1.5rem;font-size:0.9rem;}
    .btn-shop{display:inline-flex;align-items:center;gap:0.4rem;padding:0.7rem 1.6rem;background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary));color:white;border-radius:var(--radius-full);font-size:0.88rem;font-weight:600;box-shadow:0 4px 16px rgba(201,133,160,0.3);transition:all var(--transition);}
    .btn-shop:hover{transform:translateY(-2px);}

    /* Recommend */
    .cart-recommend{margin-top:1.5rem;padding:1.25rem 1.5rem;background:white;border-radius:var(--radius-lg);border:1px solid rgba(201,168,76,0.1);box-shadow:var(--shadow-sm);}
    .recommend-title{font-size:0.88rem;font-weight:600;color:var(--color-warm-brown);margin-bottom:1rem;display:flex;align-items:center;gap:0.4rem;}
    .recommend-items{display:flex;gap:0.75rem;overflow-x:auto;padding-bottom:0.5rem;}
    .rec-item{flex-shrink:0;width:120px;padding:0.75rem;background:var(--color-ivory);border-radius:var(--radius-md);border:1px solid rgba(201,168,76,0.12);text-align:center;cursor:pointer;transition:all var(--transition);}
    .rec-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
    .rec-emoji{height:48px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;}
    .rec-emoji img{width:100%;height:100%;object-fit:cover;}
    .rec-name{font-size:0.72rem;font-weight:600;color:var(--color-warm-brown);margin-bottom:0.2rem;}
    .rec-price{font-size:0.75rem;color:var(--color-primary-dark);font-weight:700;}
    .rec-add{font-size:0.7rem;color:var(--color-warm-brown-light);}

    /* Cart Sidebar */
    .cart-sidebar{display:flex;flex-direction:column;gap:1rem;position:sticky;top:80px;}

    /* Coupon */
    .coupon-card{background:white;border-radius:var(--radius-lg);border:1px solid rgba(201,168,76,0.1);box-shadow:var(--shadow-sm);overflow:hidden;}
    .card-header{padding:1rem 1.25rem;background:linear-gradient(135deg,var(--color-ivory),var(--color-cream));border-bottom:1px solid rgba(201,168,76,0.08);font-weight:600;font-size:0.88rem;color:var(--color-warm-brown);display:flex;align-items:center;gap:0.4rem;}
    .card-body{padding:1.25rem;}
    .coupon-input-row{display:flex;gap:0.5rem;}
    .coupon-input{flex:1;padding:0.6rem 0.9rem;border:1.5px solid rgba(201,168,76,0.2);border-radius:var(--radius-full);font-size:0.84rem;outline:none;transition:border-color var(--transition);font-family:inherit;}
    .coupon-input:focus{border-color:var(--color-primary);}
    .btn-apply{padding:0.6rem 1.1rem;background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary));color:white;border:none;border-radius:var(--radius-full);font-size:0.82rem;font-weight:600;white-space:nowrap;transition:all var(--transition);}
    .btn-apply:hover{opacity:0.88;}
    .coupon-tips{margin-top:0.75rem;}
    .coupon-tip{font-size:0.75rem;color:var(--color-warm-brown-light);padding:0.3rem 0;cursor:pointer;transition:color var(--transition);display:flex;align-items:center;gap:0.3rem;}
    .coupon-tip:hover{color:var(--color-primary-dark);}
    .coupon-applied{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.9rem;background:rgba(72,187,120,0.08);border-radius:var(--radius-sm);margin-top:0.5rem;font-size:0.82rem;display:none;}
    .coupon-applied-text{color:#276749;font-weight:600;}
    .btn-remove-coupon{border:none;background:none;color:rgba(107,66,38,0.4);font-size:0.8rem;cursor:pointer;}

    /* Summary */
    .summary-card{background:white;border-radius:var(--radius-lg);border:1px solid rgba(201,168,76,0.1);box-shadow:var(--shadow-sm);overflow:hidden;}
    .summary-rows{padding:1.25rem;display:flex;flex-direction:column;gap:0.75rem;}
    .summary-row{display:flex;justify-content:space-between;align-items:center;font-size:0.88rem;}
    .summary-row.total{font-weight:700;font-size:1.05rem;padding-top:0.75rem;border-top:1px solid rgba(201,168,76,0.1);}
    .summary-row .label{color:var(--color-warm-brown-light);}
    .summary-row .val{color:var(--color-warm-brown);}
    .summary-row.total .val{color:var(--color-primary-dark);font-size:1.3rem;font-family:var(--font-serif);}
    .summary-row .discount{color:#276749;}
    .btn-checkout{
      width:100%;padding:1rem;
      background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary),var(--color-gold));
      color:white;border:none;border-radius:var(--radius-full);
      font-size:1rem;font-weight:700;letter-spacing:0.05em;
      box-shadow:0 6px 25px rgba(201,133,160,0.35);
      transition:all var(--transition);margin:0 1.25rem 1.25rem;
    }
    .btn-checkout:hover{transform:translateY(-2px);box-shadow:0 10px 35px rgba(201,133,160,0.45);}
    .btn-checkout:disabled{opacity:0.5;pointer-events:none;}
    .checkout-safety{display:flex;justify-content:center;gap:1.5rem;padding:0 1.25rem 1rem;flex-wrap:wrap;}
    .safety-item{display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;color:var(--color-warm-brown-light);}

    /* Toast */
    .toast{position:fixed;bottom:2rem;right:2rem;z-index:9999;padding:0.85rem 1.5rem;background:#1A1208;color:white;border-radius:var(--radius-md);font-size:0.88rem;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,0.2);transform:translateY(100px);opacity:0;transition:all 0.3s ease;pointer-events:none;}
    .toast.show{transform:translateY(0);opacity:1;}

    /* Batch Actions */
    .batch-actions{display:flex;gap:0.5rem;padding:0.75rem 1.5rem;background:rgba(232,180,197,0.04);border-top:1px solid rgba(201,168,76,0.06);align-items:center;}
    .batch-actions .batch-label{font-size:0.8rem;color:var(--color-warm-brown-light);margin-right:auto;}
    .btn-batch{padding:0.35rem 0.8rem;border:1px solid rgba(201,168,76,0.2);border-radius:var(--radius-full);background:white;font-size:0.75rem;color:var(--color-warm-brown-light);cursor:pointer;transition:all var(--transition);}
    .btn-batch:hover{border-color:var(--color-primary);color:var(--color-primary-dark);background:rgba(232,180,197,0.06);}
    .btn-batch.danger:hover{border-color:#E53E3E;color:#E53E3E;background:rgba(229,62,62,0.05);}

    /* Enhanced Empty */
    .cart-empty-enhanced{padding:4rem 2rem;text-align:center;}
    .cart-empty-enhanced .empty-icon{font-size:5rem;margin-bottom:1.25rem;opacity:0.35;}
    .cart-empty-enhanced h3{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;color:var(--color-warm-brown);margin-bottom:0.5rem;}
    .cart-empty-enhanced p{font-size:0.88rem;color:var(--color-warm-brown-light);margin-bottom:1.5rem;line-height:1.6;}
    .empty-tips{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem;}
    .empty-tip{display:flex;align-items:center;gap:0.3rem;font-size:0.78rem;color:var(--color-warm-brown-light);}

    /* Footer */
    .site-footer{margin-top:3rem;padding:2rem 2rem 1rem;background:linear-gradient(160deg,var(--color-cream),var(--color-ivory));border-top:1px solid rgba(201,168,76,0.1);text-align:center;}
    .footer-links{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin:0.5rem 0;}
    .footer-links a{font-size:0.78rem;color:var(--color-warm-brown-light);transition:color var(--transition);}
    .footer-links a:hover{color:var(--color-warm-brown);}
    .footer-copy{font-size:0.72rem;color:rgba(160,112,74,0.5);}

    @media(max-width:768px){.page-wrap{padding:80px 1rem 6rem;}}
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-icon">🌸</div>
      <span class="brand-name">七白润光</span>
    </a>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <a href="tech.html" style="font-size:0.78rem;color:var(--color-warm-brown-light);padding:0.35rem 0.7rem;border:1px solid rgba(201,168,76,0.2);border-radius:var(--radius-full);transition:all var(--transition);">🔬 工艺</a>
      <a href="member.html" style="font-size:1.2rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background var(--transition);" id="userBtn">👤</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-title">🛒 购物车 <span id="cartCount" style="font-size:1rem;color:var(--color-warm-brown-light);font-weight:400;font-family:var(--font-sans);">（0件商品）</span></div>

    <div class="cart-layout">

      <!-- Cart List -->
      <div>
        <div class="cart-list" id="cartList">
          <!-- Header -->
          <div class="cart-header">
            <label class="check-all-wrap">
              <input type="checkbox" class="cb" id="checkAll" checked>
              <span style="font-size:0.85rem;font-weight:500;">全选</span>
            </label>
            <span class="cart-header-text" id="selectedCount">已选0件</span>
          </div>
          <!-- Items will be rendered by JS -->
          <div id="cartItems"></div>
        </div>

        <!-- Batch Actions Bar -->
        <div class="batch-actions" id="batchBar" style="display:none;">
          <span class="batch-label" id="batchLabel">已选0件</span>
          <button class="btn-batch" onclick="batchMoveToFav()">❤️ 移入收藏</button>
          <button class="btn-batch danger" onclick="batchDelete()">🗑️ 批量删除</button>
        </div>

        <!-- Recommend -->
        <div class="cart-recommend">
          <div class="recommend-title">💡 猜你喜欢</div>
          <div class="recommend-items">
            <div class="rec-item" onclick="addRecommendToCart('gift','21天食养礼盒','images/Elegant_gift_box_packaging_for_2026-05-18T15-58-48.png',368)">
              <div class="rec-emoji"><img src="images/Elegant_gift_box_packaging_for_2026-05-18T15-58-48.png" alt="21天食养礼盒"></div>
              <div class="rec-name">21天食养礼盒</div>
              <div class="rec-price">¥368</div>
              <div class="rec-add">+ 加购</div>
            </div>
            <div class="rec-item" onclick="addRecommendToCart('notebook','食养手账本','images/Traditional_Chinese_medicine_h_2026-05-18T15-58-05.png',38)">
              <div class="rec-emoji"><img src="images/Traditional_Chinese_medicine_h_2026-05-18T15-58-05.png" alt="食养手账本"></div>
              <div class="rec-name">食养手账本</div>
              <div class="rec-price">¥38</div>
              <div class="rec-add">+ 加购</div>
            </div>
            <div class="rec-item" onclick="addRecommendToCart('bag','便携手提袋','images/A_premium_rose_flavored_gummy__2026-05-18T15-57-19.png',18)">
              <div class="rec-emoji"><img src="images/A_premium_rose_flavored_gummy__2026-05-18T15-57-19.png" alt="便携手提袋"></div>
              <div class="rec-name">便携手提袋</div>
              <div class="rec-price">¥18</div>
              <div class="rec-add">+ 加购</div>
            </div>
            <div class="rec-item" onclick="addRecommendToCart('card','食养月卡','images/Elegant_gift_box_packaging_for_2026-05-18T15-58-48.png',168)">
              <div class="rec-emoji"><img src="images/Elegant_gift_box_packaging_for_2026-05-18T15-58-48.png" alt="食养月卡"></div>
              <div class="rec-name">食养月卡会员</div>
              <div class="rec-price">¥168</div>
              <div class="rec-add">+ 加购</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="cart-sidebar">

        <!-- Coupon -->
        <div class="coupon-card">
          <div class="card-header">🎟️ 优惠券 / 促销码</div>
          <div class="card-body">
            <div class="coupon-input-row">
              <input type="text" class="coupon-input" id="couponInput" placeholder="输入优惠码">
              <button class="btn-apply" id="applyCoupon">兑换</button>
            </div>
            <div id="couponApplied" class="coupon-applied">
              <span class="coupon-applied-text" id="couponAppliedText"></span>
              <button class="btn-remove-coupon" id="removeCoupon">✕</button>
            </div>
            <div class="coupon-tips">
              <div class="coupon-tip" onclick="fillCoupon('QIBAI10')">🌸 QIBAI10 — 全场9折</div>
              <div class="coupon-tip" onclick="fillCoupon('SIGN21')">📅 SIGN21 — 21天计划专属8折</div>
              <div class="coupon-tip" onclick="fillCoupon('WELCOME20')">🎁 WELCOME20 — 新用户立减¥20</div>
            </div>
          </div>
        </div>

        <!-- Summary -->
        <div class="summary-card">
          <div class="card-header">📋 订单摘要</div>
          <div class="summary-rows">
            <div class="summary-row">
              <span class="label">商品金额</span>
              <span class="val" id="subtotal">¥0</span>
            </div>
            <div class="summary-row" id="discountRow" style="display:none">
              <span class="label">优惠折扣</span>
              <span class="val discount" id="discountAmt"></span>
            </div>
            <div class="summary-row">
              <span class="label">运费</span>
              <span class="val" id="shipping">¥0</span>
            </div>
            <div class="summary-row" style="font-size:0.78rem;color:var(--color-warm-brown-light);">
              <span>满¥199包邮·顺丰速运</span>
            </div>
            <div class="summary-row total">
              <span class="label">合计</span>
              <span class="val" id="total">¥0</span>
            </div>
          </div>
          <button class="btn-checkout" id="btnCheckout" onclick="checkout()">去结算</button>
          <div class="checkout-safety">
            <span class="safety-item">🔒 安全支付</span>
            <span class="safety-item">🚚 顺丰速运</span>
            <span class="safety-item">💰 七天退换</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="index.html">首页</a>
      <a href="product.html">商品</a>
      <a href="tech.html">研发工艺</a>
      <a href="compliance.html">合规说明</a>
      <a href="member.html">会员中心</a>
    </div>
    <div class="footer-copy">© 2026 七白润光 · 普通食品</div>
  </footer>

  <script>
    let cart = JSON.parse(localStorage.getItem('qibai_cart') || '[]');
    let couponDiscount = 0;
    let couponCode = '';
    let couponLabel = '';

    const COUPONS = {
      'QIBAI10': { type: 'pct', val: 0.9, label: '全场9折 (QIBAI10)' },
      'SIGN21':  { type: 'pct', val: 0.8, label: '21天计划专属8折 (SIGN21)' },
      'WELCOME20': { type: 'fixed', val: 20, label: '新用户立减¥20 (WELCOME20)' }
    };

    function saveCart() {
      localStorage.setItem('qibai_cart', JSON.stringify(cart));
    }

    function getCheckedItems() {
      return cart.filter(i => i.checked);
    }

    function calcSubtotal() {
      return getCheckedItems().reduce((s, i) => s + i.price * (i.qty || 1), 0);
    }

    function calcTotal() {
      let sub = calcSubtotal();
      let disc = 0;
      if (couponCode) {
        const c = COUPONS[couponCode];
        if (c.type === 'pct') disc = Math.round(sub * (1 - c.val));
        else disc = Math.min(c.val, sub);
      }
      couponDiscount = disc;
      const afterDisc = sub - disc;
      const shipping = afterDisc >= 199 ? 0 : 12;
      return { sub, disc, shipping, total: afterDisc + shipping };
    }

    function renderSummary() {
      const { sub, disc, shipping, total } = calcTotal();
      document.getElementById('subtotal').textContent = '¥' + sub;
      document.getElementById('shipping').textContent = shipping === 0 ? '免运费' : '¥' + shipping;
      document.getElementById('total').textContent = '¥' + total;

      const dr = document.getElementById('discountRow');
      if (disc > 0) {
        dr.style.display = 'flex';
        document.getElementById('discountAmt').textContent = '-¥' + disc;
      } else {
        dr.style.display = 'none';
      }

      const checked = getCheckedItems();
      document.getElementById('selectedCount').textContent = `已选${checked.length}件`;
      document.getElementById('cartCount').textContent = `（${cart.length}件商品）`;
      document.getElementById('btnCheckout').disabled = checked.length === 0;
      const batchBar = document.getElementById('batchBar');
      if (batchBar) document.getElementById('batchLabel').textContent = `已选${checked.length}件`;
    }

    function renderCartItems() {
      const container = document.getElementById('cartItems');
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty-enhanced">
            <div class="empty-icon">🛒</div>
            <h3>购物车空空如也</h3>
            <p>快去挑选心仪的食养好物吧~<br>新用户首单还可享专属优惠哦</p>
            <a href="product.html" class="btn-shop">🌸 去选购</a>
            <div class="empty-tips">
              <span class="empty-tip">🚚 满¥199包邮</span>
              <span class="empty-tip">🔒 安全支付</span>
              <span class="empty-tip">💰 七天退换</span>
            </div>
          </div>`;
        return;
      }

      container.innerHTML = cart.map((item, idx) => `
        <div class="cart-item" data-idx="${idx}">
          <input type="checkbox" class="cb item-cb" data-idx="${idx}" ${item.checked ? 'checked' : ''}>
          <div class="item-emoji"><img src="${item.image || 'images/A_premium_rose_flavored_gummy__2026-05-18T15-57-19.png'}" alt="${item.name}"></div>
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <div class="item-spec">
              ${item.flavor ? `<span>${item.flavor}</span>` : ''}
              ${item.pkg ? `<span>${item.pkg}</span>` : ''}
            </div>
            <div class="item-price-row">
              <span class="item-price">¥${item.price}</span>
              <div class="item-qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
                <input class="qty-num" value="${item.qty || 1}" readonly>
                <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
              </div>
              <span class="item-subtotal">¥${item.price * (item.qty || 1)}</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:0.25rem;">
            <button class="btn-delete" onclick="moveToFav(${idx})" title="移入收藏" style="color:var(--color-gold-dark);">❤️</button>
            <button class="btn-delete" onclick="deleteItem(${idx})" title="删除">🗑️</button>
          </div>
        </div>
      `).join('');

      // Batch actions bar
      const batchBar = document.getElementById('batchBar');
      if (cart.length > 0) {
        batchBar.style.display = 'flex';
      } else {
        batchBar.style.display = 'none';
      }

      // Checkboxes
      document.querySelectorAll('.item-cb').forEach(cb => {
        cb.addEventListener('change', function() {
          const idx = parseInt(this.dataset.idx);
          cart[idx].checked = this.checked;
          saveCart();
          syncCheckAll();
          renderSummary();
        });
      });

      // Check all state
      syncCheckAll();
      renderSummary();
    }

    function syncCheckAll() {
      const all = cart.length > 0 && cart.every(i => i.checked);
      document.getElementById('checkAll').checked = all;
    }

    function changeQty(idx, delta) {
      cart[idx].qty = Math.max(1, Math.min(99, (cart[idx].qty || 1) + delta));
      saveCart();
      renderCartItems();
      renderSummary();
    }

    function deleteItem(idx) {
      cart.splice(idx, 1);
      saveCart();
      renderCartItems();
      renderSummary();
      showToast('商品已移除');
    }

    function moveToFav(idx) {
      const item = cart[idx];
      const favs = JSON.parse(localStorage.getItem('qibai_favorites') || '[]');
      const exists = favs.findIndex(f => f.id === item.id);
      if (exists < 0) {
        favs.push({ id: item.id, name: item.name, price: item.price, emoji: item.emoji });
        localStorage.setItem('qibai_favorites', JSON.stringify(favs));
      }
      cart.splice(idx, 1);
      saveCart();
      renderCartItems();
      renderSummary();
      showToast('❤️ 已移入收藏');
    }

    function batchDelete() {
      const checked = cart.filter(i => i.checked);
      if (checked.length === 0) { showToast('请先选择商品'); return; }
      cart = cart.filter(i => !i.checked);
      saveCart();
      renderCartItems();
      renderSummary();
      showToast('🗑️ 已删除' + checked.length + '件商品');
    }

    function batchMoveToFav() {
      const checked = cart.filter(i => i.checked);
      if (checked.length === 0) { showToast('请先选择商品'); return; }
      const favs = JSON.parse(localStorage.getItem('qibai_favorites') || '[]');
      checked.forEach(item => {
        if (!favs.find(f => f.id === item.id)) {
          favs.push({ id: item.id, name: item.name, price: item.price, emoji: item.emoji });
        }
      });
      localStorage.setItem('qibai_favorites', JSON.stringify(favs));
      cart = cart.filter(i => !i.checked);
      saveCart();
      renderCartItems();
      renderSummary();
      showToast('❤️ 已移入收藏：' + checked.length + '件');
    }

    // Check all
    document.getElementById('checkAll').addEventListener('change', function() {
      cart.forEach(i => i.checked = this.checked);
      saveCart();
      renderCartItems();
      renderSummary();
    });

    // Coupon
    function fillCoupon(code) {
      document.getElementById('couponInput').value = code;
    }

    document.getElementById('applyCoupon').addEventListener('click', () => {
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      if (!code) { showToast('请输入优惠码'); return; }
      const coupon = COUPONS[code];
      if (!coupon) { showToast('❌ 优惠码无效或已过期'); return; }
      couponCode = code;
      couponLabel = coupon.label;
      document.getElementById('couponApplied').style.display = 'flex';
      document.getElementById('couponAppliedText').textContent = '✅ ' + couponLabel;
      renderSummary();
      showToast('🎉 优惠券已应用！');
    });

    document.getElementById('removeCoupon').addEventListener('click', () => {
      couponCode = ''; couponLabel = '';
      document.getElementById('couponApplied').style.display = 'none';
      document.getElementById('couponInput').value = '';
      renderSummary();
      showToast('已移除优惠券');
    });

    function addRecommendToCart(id, name, emoji, price) {
      const key = 'rec_' + id;
      const idx = cart.findIndex(i => i.id === key);
      if (idx >= 0) { cart[idx].qty++; }
      else { cart.push({ id: key, name, emoji, price, qty: 1, checked: true }); }
      saveCart();
      renderCartItems();
      showToast('🛒 已加入：' + name);
    }

    function checkout() {
      const checked = getCheckedItems();
      if (checked.length === 0) { showToast('请至少选择一件商品'); return; }

      const user = JSON.parse(localStorage.getItem('qibai_user') || 'null');
      if (!user) {
        showToast('请先登录');
        setTimeout(() => { window.location.href = 'login.html?redirect=order.html'; }, 800);
        return;
      }
      // Save checkout items
      const { total, disc, shipping } = calcTotal();
      localStorage.setItem('qibai_checkout', JSON.stringify({
        items: checked, total, disc, shipping, couponCode, couponLabel
      }));
      window.location.href = 'order.html?step=address';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Init
    function init() {
      // Ensure all have checked property
      cart.forEach(i => { if (i.checked === undefined) i.checked = true; });
      renderCartItems();
      renderSummary();

      // User status
      const user = JSON.parse(localStorage.getItem('qibai_user') || 'null');
      if (user) document.getElementById('userBtn').textContent = user.avatar || '👤';
    }

    init();
  </script>
</body>
</html>
